<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <style>
    .ear-left { transform-origin: 10px 14px; animation: twitch 5s ease-in-out infinite; }
    .ear-right { transform-origin: 34px 14px; animation: twitch 5s ease-in-out .25s infinite; }
    .eyes { transform-origin: 22px 21px; animation: blink 6s ease-in-out infinite; }
    @keyframes twitch { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-7deg); } 94% { transform: rotate(3deg); } }
    @keyframes blink { 0%, 92%, 96%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.12); } }
    @media (prefers-reduced-motion: reduce) { .ear-left, .ear-right, .eyes { animation: none; } }
  </style>
  <circle cx="22" cy="24" r="15" fill="#E8B868"/>
  <circle cx="22" cy="24" r="14" fill="url(#fur)"/>
