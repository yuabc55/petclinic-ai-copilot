  <path d="m14 26-6-1m6 3-7 1m23-3 6-1m-6 3 7 1" stroke="#BA9365" stroke-width="1" stroke-linecap="round"/>
  <path d="M15 35c2 3 5 4 7 4s5-1 7-4" stroke="#4F6D7A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="22" cy="39" r="2.2" fill="#C99A4A" stroke="#FFF" stroke-width=".8"/>
